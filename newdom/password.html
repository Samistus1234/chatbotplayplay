<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
        }

        .split-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* Left Panel - Decorative */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }

        .left-panel h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .left-panel p {
            font-size: 1.2rem;
            opacity: 0.9;
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }

        .decoration {
            width: 200px;
            height: 200px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .decoration::before {
            content: '';
            width: 150px;
            height: 150px;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
        }

        /* Right Panel - Login Form */
        .right-panel {
            flex: 1;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .login-form {
            width: 100%;
            max-width: 400px;
        }

        .login-form h2 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .login-form .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        #passwordInput {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e1e1e1;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        #passwordInput:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        #passwordInput::placeholder {
            color: #aaa;
        }

        #passwordBtn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        #passwordBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        #passwordBtn:active {
            transform: translateY(0);
        }

        #passMessage {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            text-align: center;
            min-height: 20px;
            transition: all 0.3s ease;
        }

        #passMessage:not(:empty) {
            background: #f0f0f0;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }

            .left-panel {
                padding: 60px 40px;
            }

            .left-panel h1 {
                font-size: 2rem;
            }

            .decoration {
                width: 120px;
                height: 120px;
                margin-bottom: 30px;
            }

            .decoration::before {
                width: 80px;
                height: 80px;
            }

            .right-panel {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>

<div class="split-container">
    <!-- Left Panel -->
    <div class="left-panel">
        <div class="decoration"></div>
        <h1>Welcome Back</h1>
        <p>Enter your password to access your account and continue your journey with us.</p>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
        <div class="login-form">
            <h2>Login</h2>
            <p class="subtitle">Please enter your password to continue</p>

            <div class="input-group">
                <label for="passwordInput">Password</label>
                <input id="passwordInput" type="password" placeholder="Enter your password">
            </div>

            <button type="button" id="passwordBtn">Sign In</button>

            <p id="passMessage"></p>
        </div>
    </div>
</div>

<script>
const passwordInput = document.getElementById("passwordInput")
const passwordBtn = document.getElementById("passwordBtn")
const passMessage = document.getElementById("passMessage")

passwordBtn.addEventListener("click", () => {
    const password = passwordInput.value

    if (password.length < 6) {
        passMessage.textContent = "Password is too short, must be at least 6 characters";
        passMessage.style.color = "#e74c3c";
        passMessage.style.background = "#fdeaea";
    } else {
        passMessage.textContent = "Login successful";
        passMessage.style.color = "#27ae60";
        passMessage.style.background = "#e8f8ef";
    }
})
</script>

</body>
</html>
